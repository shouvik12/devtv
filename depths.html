<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Depths · DEV·TV</title>
<style>
:root{
  color-scheme: light;
  --page:#cdd5c4; --bezel:#728d7a; --bezel-hi:#8ba591; --bezel-line:#a9b9a0;
  --badge:#ded4ac; --badge-ink:#2a2a1e; --key:#3f5a48; --key-ink:#e9efe3; --key-line:#2b4134;
  --key-hot:#5c2a26; --key-hot-ink:#ffd9cf;
  --screen:#07090c; --ink:#f2ede1; --dim:#a9a395; --coral:#ff6447; --coral-soft:rgba(255,100,71,.14);
  --shade:rgba(3,6,10,.82);
  --mono:"Courier New",Courier,ui-monospace,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#131a15; --bezel:#3d5545; --bezel-hi:#4c6855; --bezel-line:#5b7361;
    --badge:#c9c099; --badge-ink:#211f15; --key:#28392d; --key-ink:#dde7d8; --key-line:#18241b;
    --key-hot:#4a1f1b; --key-hot-ink:#ffcfc2;
    --screen:#05070a; --ink:#f2ede1; --dim:#a39d8f; --coral:#ff6a4d; --coral-soft:rgba(255,106,77,.14);
    --shade:rgba(2,4,8,.85);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;min-height:100dvh}
.tv{width:min(100%,600px);height:min(100dvh,1000px);padding:12px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,var(--bezel-hi),var(--bezel));border:3px solid var(--bezel-line);border-radius:22px}
.top{display:flex;align-items:center;gap:10px}
.badge{background:var(--badge);color:var(--badge-ink);font:800 22px/1 var(--sans);letter-spacing:.06em;padding:10px 16px;border-radius:10px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.25)}
.clock{background:#000;color:#e8e2d2;font:15px/1 var(--mono);letter-spacing:.15em;padding:10px 12px;border-radius:8px}
.chname{margin-left:auto;color:var(--key-ink);font:14px/1.2 var(--mono);opacity:.85;text-align:right}

.screen{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--screen);
  border:2px solid rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);touch-action:none;cursor:ns-resize}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s ease;pointer-events:none;z-index:6}

.osd{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;gap:12px;z-index:3;pointer-events:none}
.live{display:flex;align-items:center;gap:8px;color:var(--dim);font:14px/1 var(--mono);letter-spacing:.2em;margin-top:9px}
.live i{width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 10px var(--coral)}
.chip{border:2px solid var(--coral);color:var(--coral);border-radius:8px;padding:6px 10px;font:700 14px/1 var(--sans);letter-spacing:.04em;background:var(--coral-soft)}
.chip span{font-family:var(--mono);font-weight:400;margin-right:6px}
.depth{margin-left:auto;text-align:right;color:var(--ink)}
.depth b{display:block;font:800 34px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.depth small{font:12px/1.4 var(--mono);color:var(--dim)}

#labels{position:absolute;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;color:var(--ink);
  transform-origin:0 0;text-shadow:0 1px 6px rgba(0,0,0,.9);padding:4px 6px;border-radius:6px;transition:background .2s}
.lbl:hover,.lbl:focus-visible{background:rgba(0,0,0,.45);outline:none}
.lbl.picked{background:var(--coral-soft);box-shadow:0 0 0 1px var(--coral)}
.screen{cursor:pointer}
.lbl .n{font:600 13px/1.2 var(--sans)}
.lbl .y{font:11px/1.2 var(--mono);color:var(--dim);margin-left:6px}
.lbl.wreck .n{color:#b9c3c6;font-style:italic;font-weight:500}
.lbl.event .n{color:var(--coral)}

.card{position:absolute;left:8%;right:8%;top:30%;text-align:center;z-index:4;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
.card.on{opacity:1;transform:none}
.card .cy{font:15px/1 var(--mono);color:var(--coral);letter-spacing:.2em;margin-bottom:12px}
.card .ct{font:800 clamp(30px,7.5vw,48px)/1.02 var(--sans);color:var(--ink);letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.8)}
.card .cs{font:16px/1.45 var(--sans);color:var(--ink);opacity:.82;margin:12px auto 0;max-width:30ch;text-shadow:0 1px 10px #000}

.lower{position:absolute;left:0;right:0;bottom:34px;z-index:3;padding:40px 18px 12px;
  background:linear-gradient(180deg,transparent,var(--shade) 34%);color:var(--ink)}
.era{display:flex;align-items:baseline;gap:10px;font:14px/1.2 var(--mono);color:var(--coral);letter-spacing:.14em;margin-bottom:10px}
.era em{font-style:normal;color:var(--dim);letter-spacing:.05em}
.row{display:grid;grid-template-columns:62px 1fr;gap:8px;margin-bottom:8px}
.k{font:13px/1.5 var(--mono);color:var(--dim);letter-spacing:.12em}
.nowT{font:700 20px/1.2 var(--sans);letter-spacing:-.01em}
.nowB{font:15px/1.4 var(--sans);color:var(--ink);opacity:.82;margin-top:3px;max-width:52ch}
.nextT{font:15px/1.4 var(--sans);color:var(--dim)}
.cur{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.cur div{font:12px/1.35 var(--mono);color:var(--dim)}
.cur b{display:block;font:600 13px/1.3 var(--sans);color:var(--ink);transition:color .4s}
.cur b.flash{color:var(--coral)}
.cur i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.ticker{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:3;overflow:hidden;background:rgba(0,0,0,.9);border-top:1px solid rgba(255,255,255,.08)}
.track{position:absolute;white-space:nowrap;top:9px;font:14px/1 var(--mono);color:var(--dim);letter-spacing:.08em;animation:tick 60s linear infinite}
.track b{color:var(--coral);font-weight:700;margin:0 8px 0 26px}
@keyframes tick{to{transform:translateX(-50%)}}

.guide{position:absolute;inset:0;z-index:5;background:rgba(3,5,8,.92);padding:22px;display:none;overflow:auto}
.guide.on{display:block}
.guide h3{font:800 24px/1 var(--sans);color:var(--ink);margin:4px 0 16px}
.guide button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.1);
  color:var(--ink);font:600 17px/1.3 var(--sans);padding:14px 2px;cursor:pointer}
.guide button span{font:13px/1.6 var(--mono);color:var(--coral)}

.remote{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr 1fr;gap:8px;padding:10px;border-radius:18px;background:rgba(0,0,0,.14)}
.remote button{white-space:nowrap;height:52px;border-radius:12px;border:2px solid var(--key-line);background:var(--key);color:var(--key-ink);
  font:15px/1 var(--mono);letter-spacing:.06em;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.remote button.hot{background:var(--key-hot);color:var(--key-hot-ink)}
.remote button.main{font:800 15px/1 var(--sans);letter-spacing:0}
.remote button:focus-visible,.guide button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media (max-width:420px){.remote button{font-size:13px;height:48px}.depth b{font-size:28px}.chname{display:none}}
body.embed{background:#000;display:block}
body.embed .tv{width:100%;height:100dvh;padding:0;border:0;border-radius:0;background:#000;gap:0}
body.embed .top{display:none}
body.embed .screen{border:0;border-radius:0}
body.embed .remote{border-radius:0;padding:6px;gap:6px;background:var(--deck,#0b0e12)}
body.embed .remote button{background:linear-gradient(180deg,var(--key-top),var(--key-bot));border:1px solid #000;border-top:1px solid var(--key-edge);color:var(--key-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 4px rgba(0,0,0,.4)}
body.embed .remote button.hot{color:var(--coral);border-color:var(--coral)}
body.embed .remote button{height:42px}
#exit{display:none;pointer-events:auto;background:linear-gradient(180deg,#0f4d5e,#062833);color:#d8f7ff;border:1px solid #3fb4cf;border-radius:8px;width:34px;height:34px;font:16px/1 var(--sans);cursor:pointer}
body.embed #exit{display:block}
body.embed .live{display:none}
body.embed .remote{display:none!important}
#sndIcon{display:none;pointer-events:auto;background:linear-gradient(180deg,#0f4d5e,#062833);color:#d8f7ff;border:1px solid #3fb4cf;border-radius:8px;height:34px;padding:0 10px;font:12px/1 var(--mono);letter-spacing:.1em;cursor:pointer}
body.embed #sndIcon{display:block}
#sndIcon.on{color:#062833;background:linear-gradient(180deg,#8ff0ff,#3fb4cf);border-color:#bff6ff}
body.embed .remote button{font-size:12px;letter-spacing:.02em;padding:0 4px}
body.embed .remote button.main{font-size:13px}
/* Short screens (DEV·TV on a phone): keep the ocean visible. */
@media (max-height:620px){
  .lower{padding:28px 14px 8px}
  .cur,.nowB{display:none}
  .era{margin-bottom:6px;font-size:12px}
  .nowT{font-size:16px}
  .row{margin-bottom:4px;grid-template-columns:50px 1fr}
  .depth b{font-size:26px}
  .card .ct{font-size:clamp(24px,7vw,36px)}
  .card{top:22%}
}
@media (max-height:460px){ .row:nth-of-type(2){display:none} .ticker{display:none} .lower{bottom:0} }
</style>
</head>

  const o=ac.createOscillator(), g=ac.createGain(), f=500+Math.random()*900;
  o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*(1.8+Math.random()),t+.07);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05+Math.random()*.06,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  o.connect(g).connect(filt); o.start(t); o.stop(t+.12);
}
function bubbleTick(){
  if(!soundOn||!ac) return;
  while(bubbleT<ac.currentTime+.3){
    // Clusters near the surface, sparse in the deep.
    const n=Math.random()<.35?2+Math.floor(Math.random()*4):1;
    for(let k=0;k<n;k++) bubble(bubbleT+k*(.03+Math.random()*.06));
    bubbleT+=(.25+Math.random()*1.2)/(.25+soundDepth*1.1);
  }
}
function ping(){
  if(!soundOn||!ac) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(), d=ac.createDelay(), fb=ac.createGain(), out=ac.createGain();
  out.gain.value=.9; out.connect(ac.destination);
  o.type='sine'; o.frequency.setValueAtTime(1320,t); o.frequency.exponentialRampToValueAtTime(880,t+.8);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.4,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
  d.delayTime.value=.32; fb.gain.value=.42;
  o.connect(g); g.connect(out); g.connect(d); d.connect(fb); fb.connect(d); d.connect(out);
  o.start(t); o.stop(t+1.7);
}
ents.forEach(e=>{if(e.type==='s'||e.type==='e')e.onFire=()=>{ping();e.v.ping&&e.v.ping()}});

/* ---------- STATE + INPUT ---------- */
let camYear=TOPY, playing=!reduce, speed=1, pinned=null, curZone=-1, ending=false, lastT=0;
const playBtn=$('play'), speedBtn=$('speed'), sndBtn=$('snd');
function setPlay(v){playing=v;playBtn.textContent=v?'❚❚ PAUSE':'▶ WATCH';if(parent!==window)parent.postMessage({depthsPlaying:v},'*')}
setPlay(playing);
playBtn.onclick=()=>{pinned=null;setPlay(!playing)};
function setSpeed(v){speed=v;speedBtn.textContent=v+'×';pinned=null;if(!playing)setPlay(true)}
speedBtn.onclick=()=>setSpeed(speed===1?2:speed===2?3:1);
addEventListener('message',ev=>{const d=ev.data;if(!d)return;
  if(d.depthsSpeed&&+d.depthsSpeed!==speed)setSpeed(+d.depthsSpeed);
  if(typeof d.depthsPlay==='boolean'&&d.depthsPlay!==playing){pinned=null;playing=d.depthsPlay;playBtn.textContent=playing?'❚❚ PAUSE':'▶ WATCH'}
  if(d.depthsGuide)guide.classList.toggle('on');
});
if(parent!==window)parent.postMessage('depths:ready','*');
try{const ps=parent.document.getElementById('speed-btn');if(ps&&parent!==window){const v=parseFloat(ps.textContent);if(v){speed=v;speedBtn.textContent=v+'×'}}}catch(e){}
const sndIcon=$('sndIcon');
sndIcon.onclick=ev=>{ev.stopPropagation();sndBtn.click()};
sndBtn.onclick=()=>{if(!ac)initSound();soundOn=!soundOn;ac.resume();if(unlockEl){soundOn?unlockEl.play().catch(()=>{}):unlockEl.pause()}master.gain.setTargetAtTime(soundOn?.7:0,ac.currentTime,.3);if(soundOn){bubbleT=ac.currentTime+.2;setTimeout(ping,150)}sndBtn.textContent=soundOn?'SOUND ON':'SOUND';sndIcon.textContent=soundOn?'🔊 SOUND':'🔈 SOUND';sndIcon.classList.toggle('on',soundOn);sndBtn.classList.toggle('hot',soundOn)};
$('surf').onclick=()=>travel(TOPY);
function travel(yr){el.fade.style.opacity=1;setTimeout(()=>{camYear=yr;ending=false;pinned=null;el.fade.style.opacity=0},700)}
const guide=$('guide'), gl=$('guideList');
ZONES.forEach(z=>{const b=document.createElement('button');b.innerHTML=`${z.title}<span>${z.span}</span>`;b.onclick=()=>{guide.classList.remove('on');travel(Math.min(TOPY,z.to-.4))};gl.appendChild(b)});
$('guideBtn').onclick=()=>guide.classList.toggle('on');
function pin(e){
  pinned=e; setPlay(false);
  const reg=e.region&&e.region!=='US'?' · '+e.region.toUpperCase():'';
  showCard(Math.floor(e.year)+reg, e.shown, e.blurb, 5200);
  if(e.type==='e'||e.type==='s'){e.onFire&&e.onFire()} else ping();
  e.L.classList.add('picked'); setTimeout(()=>e.L.classList.remove('picked'),1600);
}
let downXY=null;
screen.addEventListener('pointerdown',ev=>{downXY=[ev.clientX,ev.clientY]});
screen.addEventListener('click',ev=>{
  if(ev.target.closest('button,.lbl,.guide'))return;
  if(downXY&&Math.hypot(ev.clientX-downXY[0],ev.clientY-downXY[1])>10)return; // that was a drag, not a tap
  const rc=screen.getBoundingClientRect(), x=ev.clientX-rc.left, y=ev.clientY-rc.top;
  let best=null,bd=90;
  for(const e of ents){if(!e.seen)continue;const d=Math.min(Math.hypot(e.sx-x,e.sy-y),Math.hypot(e.lx-x,e.ly-y));if(d<bd){bd=d;best=e}}
  if(best)pin(best);
});
screen.addEventListener('wheel',ev=>{ev.preventDefault();camYear=Math.max(BOTY,Math.min(TOPY,camYear+ev.deltaY*-.004));pinned=null},{passive:false});
let ty=null;
screen.addEventListener('touchstart',ev=>{ty=ev.touches[0].clientY},{passive:true});
screen.addEventListener('touchmove',ev=>{if(ty===null)return;const y=ev.touches[0].clientY;camYear=Math.max(BOTY,Math.min(TOPY,camYear+(y-ty)*.012));ty=y;pinned=null},{passive:true});
screen.addEventListener('touchend',()=>ty=null);
addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'){camYear=Math.max(BOTY,camYear-.5)}
  else if(ev.key==='ArrowUp'){camYear=Math.min(TOPY,camYear+.5)}
  else if(ev.key===' '){ev.preventDefault();setPlay(!playing)}
});
function resize(){const w=screen.clientWidth,h=screen.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.setViewOffset(w,h,0,h*.2,w,h);camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();
const clock=$('clock'); const tickClock=()=>{const d=new Date();clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}; tickClock(); setInterval(tickClock,15000);

/* ---------- LOOP ---------- */
const v3=new THREE.Vector3();
let prevYear=camYear;
function frame(ms){
  const t=ms/1000, dt=Math.min(.05,t-lastT); lastT=t;
  if(playing&&!ending){camYear-=dt*.28*speed;
    if(camYear<=BOTY){camYear=BOTY;ending=true;
      showCard('1951','Where it all began','UNIVAC I goes to work, and IBM is already waiting on the seabed. Rising back to today.',5200);
      setTimeout(()=>{if(ending)travel(TOPY)},6200);}
  }
  const cy=camYear, wy=Y(cy), W=screen.clientWidth, H=screen.clientHeight;
  const xs=Math.max(.42,Math.min(1.25,camera.aspect*1.25));

  camera.position.set(reduce?0:Math.sin(t*.12)*1.2,wy+1.2,14);
  camera.lookAt(0,wy-1.6,-8);

  const bg=bgAt(cy); scene.background.copy(bg); scene.fog.color.copy(bg);
  const depth01=(cy-BOTY)/(TOPY-BOTY);
  scene.fog.density=.026+(1-depth01)*.012;
  shafts.children.forEach((m,i)=>{m.material.opacity=Math.max(0,1-(2026-cy)/9)*.2*(reduce?1:.8+.2*Math.sin(t*.7+i))});
  if(filt){filt.frequency.setTargetAtTime(320+depth01*depth01*2600,ac.currentTime,.4);soundDepth=depth01;bubbleTick()}

  // snow
  for(let i=0;i<SN;i++){snowPos[i*3+1]=((snowBase[i]-wy*.9-(reduce?0:t*.25))%40+40)%40-20}
  snow.position.y=wy; snowGeo.attributes.position.needsUpdate=true;
  // currents rise upward
  for(const cu of CURS){for(let i=0;i<CN;i++){const u=((cu.base[i]*60+(reduce?0:t*1.6)-wy*.0)%60+60)%60-30, yy=wy+u;
    cu.arr[i*3]=cu.x*xs+Math.sin(yy*.12+i)*1.2+cu.off[i]; cu.arr[i*3+1]=yy; cu.arr[i*3+2]=cu.z+Math.cos(yy*.1+i)*1.4}
    cu.geo.attributes.position.needsUpdate=true}

  // entities + labels
  let near=null, nd=1e9, next=null;
  const center=cy-.35;
  for(const e of ents){
    const dist=Math.abs(e.year-cy), act=dist<6;
    e.v.obj.position.x=e.bx*xs;
    e.v.obj.visible=dist<12;
    if(e.v.obj.visible){e.v.update(t,act,cy); if(e.type!=='s'&&!reduce)e.v.obj.position.y=e.y+Math.sin(t*.6+e.bx)*.25}
    if(e.type==='e' && prevYear>e.year && cy<=e.year) e.onFire();
    const dd=Math.abs(e.year-center); if(dd<nd){nd=dd;near=e}
    if(act){
      v3.set(e.v.obj.position.x,e.v.obj.position.y+e.anchor,e.v.obj.position.z).project(camera);
      if(v3.z<1&&v3.y>-.5&&v3.y<.92){
        const x=(v3.x+1)/2*W, y=(1-v3.y)/2*H, a=Math.max(0,1-dist/3.2);
        e.seen=a>.15;
        if(e.seen){const c=e.v.obj.position; v3.set(c.x,c.y,c.z).project(camera); e.sx=(v3.x+1)/2*W; e.sy=(1-v3.y)/2*H; e.lx=x; e.ly=y}
        if(y>H*.6){e.L.style.display='none';continue}
        e.L.style.display='block'; e.L.style.opacity=a.toFixed(2);
        e.L.style.transform=`translate(${Math.min(W-e.L.offsetWidth-6,Math.max(6,x-e.L.offsetWidth/2))}px,${y}px)`;
        e.L.tabIndex=a>.3?0:-1;
      } else e.L.style.display='none';
    } else if(e.L.style.display!=='none') e.L.style.display='none';
  }
  for(const e of ents){if(!(Math.abs(e.year-cy)<6))e.seen=false}
  for(const e of ents){if(e.year<near.year-.05 && (!next||e.year>next.year)) next=e}
  prevYear=cy;

  // HUD
  const yi=Math.max(1951,Math.min(2026,Math.floor(cy)));
  el.yr.textContent=yi;
  el.yrsub.textContent=yi>=2026?'at the surface':`${2026-yi} year${2026-yi===1?'':'s'} down`;
  const zi=zoneIdx(cy);
  if(zi!==curZone){
    const first=curZone===-1; curZone=zi; const z=ZONES[zi];
    el.eraN.textContent=z.name; el.eraS.textContent=z.span; setTicker(zi);
    if(first) showCard('NOW SHOWING','The Depths','76 years of software. Today is the surface. The first machines lie on the seabed.',4200);
    else if(!ending) showCard(z.span.toUpperCase(),z.title,z.sub);
  }
  const show=pinned||near;
  if(show){
    el.nowT.textContent=`${show.shown}, ${Math.floor(show.year)}${show.region?' · '+show.region:''}`; el.nowB.textContent=show.blurb;
  }
  el.nextT.textContent=next?`${next.shown}, ${Math.floor(next.year)}`:'The seabed';
  setCur('s',el.sold,stage(SOLD,cy)); setCur('r',el.reach,stage(REACH,cy)); setCur('b',el.built,stage(BUILT,cy)); setCur('j',el.job,ZONES[zi].job);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
fetch('depths/species.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>boot(d.species||d)).catch(()=>boot(DATA_FALLBACK));
</script>
