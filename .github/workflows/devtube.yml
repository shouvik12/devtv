name: DEVTube refresh

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 08:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .devtube-cache
          key: devtube-cache-${{ github.run_id }}
          restore-keys: devtube-cache-
      - run: python3 scripts/devtube.py --days 365 --pages 1
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add devtube.json
          git diff --cached --quiet || git commit -m "Refresh DEVTUBE channel data"
          git push
